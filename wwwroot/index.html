<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>造船所 船体ブロック進捗管理システム</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 20px;
        background-color: #f4f7f6;
      }
      h1 {
        color: #1a365d;
      }
      .container {
        max-width: 1000px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .form-section {
        margin: 20px 0;
        padding: 15px;
        background: #edf2f7;
        border-radius: 6px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }
      th,
      td {
        border: 1px solid #e2e8f0;
        padding: 10px;
        text-align: left;
      }
      th {
        background-color: #2b6cb0;
        color: white;
      }
      .alert {
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 15px;
        display: none;
      }
      .alert-danger {
        background-color: #fed7d7;
        color: #9b2c2c;
        border: 1px solid #feb2b2;
      }
      .alert-success {
        background-color: #c6f6d5;
        color: #22543d;
        border: 1px solid #9ae6b4;
      }
      button {
        background-color: #3182ce;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #2b6cb0;
      }
      .btn-danger {
        background-color: #e53e3e;
      }
      .btn-danger:hover {
        background-color: #c53030;
      }
      .btn-success {
        background-color: #38a169;
      }
      .btn-success:hover {
        background-color: #2f855a;
      }
      .btn-secondary {
        background-color: #718096;
      }
      .btn-secondary:hover {
        background-color: #4a5568;
      }
      select {
        padding: 5px;
      }
      /* モーダル用スタイル */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
      }
      .modal-content {
        background: white;
        margin: 8% auto;
        padding: 25px;
        width: 450px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
      .modal-content input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>造船所 船体ブロック進捗管理システム</h1>

      <div id="message" class="alert"></div>

      <!-- 新規ブロック登録トリガー＆更新ボタン -->
      <div class="form-section">
        <button id="openModalBtn" class="btn-success">
          ＋ 新規ブロック詳細登録
        </button>
        <button id="reloadBtn">最新情報に更新</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>ブロックコード</th>
            <th>船舶ID</th>
            <th>工程名</th>
            <th>重量 (t)</th>
            <th>ステータス</th>
            <th>最終更新日時</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="blockTableBody">
          <!-- JSで動的に描画 -->
        </tbody>
      </table>
    </div>

    <!-- モーダル（ポップアップ入力フォーム） -->
    <div id="blockModal" class="modal">
      <div class="modal-content">
        <h3>新規ブロック詳細登録</h3>
        <form id="blockForm">
          <div style="margin-bottom: 12px">
            <label>ブロックコード:</label><br />
            <input
              type="text"
              id="inputBlockCode"
              placeholder="例: A-101"
              required
            />
          </div>
          <div style="margin-bottom: 12px">
            <label>船舶ID:</label><br />
            <input type="text" id="inputShipId" value="S-001" required />
          </div>
          <div style="margin-bottom: 12px">
            <label>工程名:</label><br />
            <input type="text" id="inputProcessName" value="切断" required />
          </div>
          <div style="margin-bottom: 15px">
            <label>重量 (トン):</label><br />
            <input type="number" id="inputWeightTons" value="5" required />
          </div>
          <div
            style="
              text-align: right;
              display: flex;
              justify-content: flex-end;
              gap: 10px;
            "
          >
            <button type="button" id="closeModalBtn" class="btn-secondary">
              キャンセル
            </button>
            <button type="submit" class="btn-success">登録する</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
