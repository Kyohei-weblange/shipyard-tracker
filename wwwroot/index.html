<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>造船所 船体ブロック進捗管理システム</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 20px;
        background-color: #f4f7f6;
      }
      h1 {
        color: #1a365d;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .form-section {
        margin: 20px 0;
        padding: 15px;
        background: #edf2f7;
        border-radius: 6px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .form-section input {
        padding: 8px;
        width: 250px;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }
      th,
      td {
        border: 1px solid #e2e8f0;
        padding: 10px;
        text-align: left;
      }
      th {
        background-color: #2b6cb0;
        color: white;
      }
      .alert {
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 15px;
        display: none;
      }
      .alert-danger {
        background-color: #fed7d7;
        color: #9b2c2c;
        border: 1px solid #feb2b2;
      }
      .alert-success {
        background-color: #c6f6d5;
        color: #22543d;
        border: 1px solid #9ae6b4;
      }
      button {
        background-color: #3182ce;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #2b6cb0;
      }
      .btn-danger {
        background-color: #e53e3e;
      }
      .btn-danger:hover {
        background-color: #c53030;
      }
      select {
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>造船所 船体ブロック進捗管理システム</h1>

      <div id="message" class="alert"></div>

      <!-- 新規ブロック追加フォーム -->
      <div class="form-section">
        <input
          type="text"
          id="newBlockCode"
          placeholder="ブロックコード (例: B-01)"
        />
        <button id="addBlockBtn">新規ブロック追加</button>
        <button id="reloadBtn">最新情報に更新</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>ブロック名</th>
            <th>工程（ステータス）</th>
            <th>最終更新日時</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="blockTableBody">
          <!-- JSで動的に描画 -->
        </tbody>
      </table>
    </div>
    <script src="app.js"></script>
  </body>
</html>
